<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>移动端复古游戏机</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; 
      height: 100%; 
      overflow: hidden;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
      user-select: none;
    }
    
    /* PC 提示 */
    #pc-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #1a1a1a;
      color: #fff;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
    }
    
    /* 横屏提示 */
    #portrait-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      color: #fff;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9998;
    }
    #portrait-warning .icon { font-size: 48px; margin-bottom: 16px; }
    
    /* 主界面 */
    #main-ui {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }
    
    /* 悬浮按钮 */
    #top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      z-index: 100;
    }
    .btn {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
    }
    
    /* 游戏区域 - 使用 iframe */
    #game-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    
    #game-frame {
      width: 100%;
      height: 100%;
      max-width: 500px;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 8px;
      border: none;
    }
    
    /* 虚拟按键 */
    #controls {
      position: absolute;
      inset: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5px;
      pointer-events: none;
      z-index: 50;
    }
    
    .dpad {
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      transform: scale(0.8);
    }
    .dpad button {
      width: 52px;
      height: 52px;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 10px;
      color: #fff;
      font-size: 22px;
    }
    .dpad .up { grid-column: 2; }
    .dpad .left { grid-column: 1; }
    .dpad .right { grid-column: 3; }
    .dpad .down { grid-column: 2; }
    
    .ab {
      pointer-events: auto;
      display: flex;
      gap: 14px;
      transform: scale(0.8);
    }
    .ab button {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      font-size: 26px;
      font-weight: bold;
      color: #fff;
    }
    .ab .a { background: #e74c3c; margin-top: 35px; }
    .ab .b { background: #3498db; }
    
    /* 弹窗 */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #modal.show { display: flex; }
    #modal h3 { color: #fff; margin-bottom: 24px; }
    #modal button {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 16px 36px;
      border-radius: 12px;
      margin: 8px;
      font-size: 16px;
    }
    #modal .close { margin-top: 24px; background: transparent; border: none; color: #666; }
  </style>
</head>
<body>
  <!-- PC 警告 -->
  <div id="pc-warning">
    <h2 style="color:#ff6b6b;margin-bottom:16px">📱 请使用手机打开</h2>
    <p style="color:#888">本页面专为移动设备设计</p>
  </div>
  
  <!-- 横屏警告 -->
  <div id="portrait-warning">
    <div class="icon">↻</div>
    <div>请横屏后游玩</div>
  </div>
  
  <!-- 主界面 -->
  <div id="main-ui">
    <div id="top-bar">
      <span id="slot-info" style="color:#fff;align-self:center;font-size:14px">卡带槽: 未插入</span>
      <button class="btn" onclick="openModal()">选择卡带</button>
    </div>
    
    <div id="game-area">
      <div id="game-frame"></div>
      
      <div id="controls">
        <div class="dpad">
          <button data-key="ArrowUp">↑</button>
          <button data-key="ArrowLeft">←</button>
          <button></button>
          <button data-key="ArrowRight">→</button>
          <button data-key="ArrowDown">↓</button>
        </div>
        <div class="ab">
          <button class="b" data-key="b">B</button>
          <button class="a" data-key="a">A</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 选择弹窗 -->
  <div id="modal">
    <h3>🎮 选择游戏卡带</h3>
    <button onclick="loadDemo()">🎮 预置测试 ROM</button>
    <button onclick="loadOfficial()">🔗 官方在线模拟器</button>
    <button class="close" onclick="closeModal()">关闭</button>
  </div>

  <script>
    // PC 检测
    function isPC() {
      return !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }
    
    // 横屏检测
    function isLandscape() {
      return window.innerWidth > window.innerHeight;
    }
    
    // 初始化
    function init() {
      if (isPC()) {
        document.getElementById('pc-warning').style.display = 'flex';
        return;
      }
      
      window.addEventListener('resize', checkOrientation);
      checkOrientation();
      bindControls();
    }
    
    function checkOrientation() {
      document.getElementById('portrait-warning').style.display = isLandscape() ? 'none' : 'flex';
    }
    
    function openModal() { document.getElementById('modal').classList.add('show'); }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }
    
    // 加载预置 ROM（用 iframe 嵌入官方模拟器）
    function loadDemo() {
      closeModal();
      document.getElementById('slot-info').textContent = '卡带槽: Demo ROM';
      
      const frame = document.getElementById('game-frame');
      frame.innerHTML = `
        <div style="width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:#000;color:#888">
          加载中...
        </div>
      `;
      
      // 用 iframe 加载官方模拟器，并预填 ROM
      setTimeout(() => {
        frame.innerHTML = `
          <iframe 
            src="https://demo.emulatorjs.org/#/?skip=1"
            style="width:100%;height:100%;border:none;"
            allowfullscreen>
          </iframe>
        `;
      }, 500);
    }
    
    // 加载官方在线版
    function loadOfficial() {
      closeModal();
      document.getElementById('slot-info').textContent = '卡带槽: 官方模拟器';
      document.getElementById('game-frame').innerHTML = `
        <iframe 
          src="https://demo.emulatorjs.org/"
          style="width:100%;height:100%;border:none;"
          allowfullscreen>
        </iframe>
      `;
    }
    
    // 虚拟按键（发送消息给 iframe）
    function bindControls() {
      document.querySelectorAll('#controls button').forEach(btn => {
        btn.addEventListener('touchstart', e => { e.preventDefault(); });
        btn.addEventListener('touchend', e => { e.preventDefault(); });
      });
    }
    
    init();
  </script>
</body>
</html>
