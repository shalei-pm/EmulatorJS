<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>移动端复古游戏机</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; 
      height: 100%; 
      overflow: hidden;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
      user-select: none;
    }
    
    /* PC 提示 */
    #pc-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #1a1a1a;
      color: #fff;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
    }
    
    /* 横屏提示 */
    #portrait-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      color: #fff;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9998;
    }
    #portrait-warning .icon { font-size: 48px; margin-bottom: 16px; }
    
    /* 主界面 */
    #main-ui {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }
    
    /* 悬浮按钮 */
    #top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      z-index: 100;
    }
    .btn {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
    }
    
    /* 游戏区域 */
    #game-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    
    #game-screen {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #666;
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }
    
    /* 虚拟按键 */
    #controls {
      position: absolute;
      inset: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5px;
      pointer-events: none;
    }
    
    /* 方向键 */
    .dpad {
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      transform: scale(0.85);
    }
    .dpad button {
      width: 52px;
      height: 52px;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 10px;
      color: #fff;
      font-size: 22px;
    }
    .dpad .up { grid-column: 2; }
    .dpad .left { grid-column: 1; }
    .dpad .right { grid-column: 3; }
    .dpad .down { grid-column: 2; }
    
    /* AB键 */
    .ab {
      pointer-events: auto;
      display: flex;
      gap: 14px;
      transform: scale(0.85);
    }
    .ab button {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      font-size: 26px;
      font-weight: bold;
      color: #fff;
    }
    .ab .a { background: #e74c3c; margin-top: 35px; }
    .ab .b { background: #3498db; }
    
    /* 弹窗 */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #modal.show { display: flex; }
    #modal h3 { color: #fff; margin-bottom: 24px; }
    #modal button {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 16px 36px;
      border-radius: 12px;
      margin: 8px;
      font-size: 16px;
    }
    #modal .close { 
      margin-top: 24px; 
      background: transparent;
      border: none;
      color: #666;
    }
    
    #modal .upload-btn {
      background: rgba(52, 152, 219, 0.4);
    }
  </style>
</head>
<body>
  <!-- PC 警告 -->
  <div id="pc-warning">
    <h2 style="color:#ff6b6b;margin-bottom:16px">📱 请使用手机打开</h2>
    <p style="color:#888">本页面专为移动设备设计</p>
  </div>
  
  <!-- 横屏警告 -->
  <div id="portrait-warning">
    <div class="icon">↻</div>
    <div>请横屏后游玩</div>
  </div>
  
  <!-- 主界面 -->
  <div id="main-ui">
    <!-- 顶部按钮 -->
    <div id="top-bar">
      <span id="slot-info" style="color:#fff;align-self:center;font-size:14px">卡带槽: 未插入</span>
      <button class="btn" onclick="openModal()">选择卡带</button>
    </div>
    
    <!-- 游戏区 -->
    <div id="game-area">
      <div id="game-screen">
        点击下方「选择卡带」<br>上传 ROM 文件开始游戏
      </div>
      
      <!-- 虚拟按键 -->
      <div id="controls">
        <div class="dpad">
          <button data-key="ArrowUp">↑</button>
          <button data-key="ArrowLeft">←</button>
          <button></button>
          <button data-key="ArrowRight">→</button>
          <button data-key="ArrowDown">↓</button>
        </div>
        <div class="ab">
          <button class="b" data-key="b">B</button>
          <button class="a" data-key="a">A</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 选择弹窗 -->
  <div id="modal">
    <h3>🎮 选择游戏卡带</h3>
    <button onclick="loadPreloadedRom()">🎮 预置测试 ROM</button>
    <button class="upload-btn" onclick="uploadRom()">📁 上传 ROM 文件</button>
    <button class="close" onclick="closeModal()">关闭</button>
    <input type="file" id="file-input" accept=".nes,.gb,.gbc,.snes,.sfc" style="display:none" onchange="handleFile(this)">
  </div>

  <!-- EmulatorJS -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

  <script>
    // ==================== 配置 ====================
    // EmulatorJS 配置
    var EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    var EJS_core = 'nes';
    var EJS_gameUrl = ''; // 将在加载 ROM 时设置
    
    // 预置 ROM（来自 GitHub Pages）
    const PRELOADED_ROM = {
      name: 'Demo ROM (测试)',
      url: 'https://shalei-pm.github.io/EmulatorJS/roms/demo.nes'
    };
    // ==================== 配置结束 ====================
    
    // 加载预置 ROM
    function loadPreloadedRom() {
      const gameUrl = PRELOADED_ROM.url;
      
      // 更新显示
      document.getElementById('slot-info').textContent = `卡带槽: ${PRELOADED_ROM.name}`;
      document.getElementById('game-screen').innerHTML = `
        <div style="color:#4ade80">✓ ${PRELOADED_ROM.name}</div>
        <div style="color:#888;margin-top:10px;font-size:12px">加载中...</div>
      `;
      
      // 配置 EmulatorJS
      window.EJS_gameUrl = gameUrl;
      
      // 加载模拟器（需要在 loader.js 之后）
      if (typeof EJS_start === 'function') {
        EJS_start();
      } else {
        // 等待 loader 加载完成
        setTimeout(() => {
          if (typeof EJS_start === 'function') {
            EJS_start();
          }
        }, 1000);
      }
    }
    
    // PC 检测
    function isPC() {
      return !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }
    
    // 横屏检测
    function isLandscape() {
      return window.innerWidth > window.innerHeight;
    }
    
    // 初始化
    function init() {
      if (isPC()) {
        document.getElementById('pc-warning').style.display = 'flex';
        return;
      }
      
      window.addEventListener('resize', checkOrientation);
      checkOrientation();
      
      // 绑定虚拟按键
      bindControls();
    }
    
    function checkOrientation() {
      const warning = document.getElementById('portrait-warning');
      warning.style.display = isLandscape() ? 'none' : 'flex';
    }
    
    // 弹窗
    function openModal() {
      document.getElementById('modal').classList.add('show');
    }
    
    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }
    
    // 上传 ROM
    function uploadRom() {
      document.getElementById('file-input').click();
    }
    
    function handleFile(input) {
      const file = input.files[0];
      if (!file) return;
      
      closeModal();
      
      // 更新显示
      document.getElementById('slot-info').textContent = `卡带槽: ${file.name}`;
      document.getElementById('game-screen').innerHTML = `
        <div style="color:#4ade80">✓ ${file.name}</div>
        <div style="color:#888;margin-top:10px;font-size:12px">ROM 已加载</div>
        <div style="color:#666;margin-top:20px">模拟器区域<br>（需配置 CORS）</div>
      `;
      
      // TODO: 实际加载 ROM 到模拟器
      alert('ROM 文件: ' + file.name + '\n\n模拟器需要配置 CORS 支持的 ROM URL，暂时无法直接加载本地文件。');
    }
    
    // 虚拟按键
    function bindControls() {
      document.querySelectorAll('#controls button').forEach(btn => {
        btn.addEventListener('touchstart', e => { e.preventDefault(); btn.style.background='rgba(255,255,255,0.5)'; });
        btn.addEventListener('touchend', e => { e.preventDefault(); btn.style.background=''; });
      });
    }
    
    init();
  </script>
</body>
</html>
